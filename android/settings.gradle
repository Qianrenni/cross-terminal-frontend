/**
 * ⚠️ 路径指向**仓库根**的 `node_modules`。
 *
 * 仓库 `.npmrc` 设了 `node-linker=hoisted`（扁平化布局），依赖全部装在根目录，
 * `packages/rn-app/node_modules/@react-native/...` 并不存在（那是 npm 非 monorepo 布局的路径）。
 * 如果以后改成 pnpm 的 isolated 布局，这里要改成 `.pnpm` 里的真实目录，
 * 或给 `packages/rn-app` 加 `@react-native/gradle-plugin` 直接依赖。
 */
pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }

plugins { id("com.facebook.react.settings") }

/**
 * 本仓库布局与 RN 模板不同：RN 工程在 `packages/rn-app`，原生工程在 `android/`。
 * 因此 autolinking 必须显式指定「命令的工作目录」，否则会去 `android/../node_modules` 找 CLI。
 */
def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(
            [isWindows ? "npx.cmd" : "npx", "@react-native-community/cli", "config"],
            new File(settingsDir, "../packages/rn-app")
    )
}

rootProject.name = 'CrossTermHost'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
